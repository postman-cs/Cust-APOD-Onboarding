# Postman collection runs (V1)
# Logs in with the Postman CLI and runs the collections of a Postman workspace
# (all of them, or just POSTMAN_COLLECTION_IDS) against the workspace's mock environment.
# Requires the masked CI/CD variable POSTMAN_API_KEY. See README.md.

include:
  - local: .gitlab/postman/*.gitlab-ci.yml

variables:
  POSTMAN_WORKSPACE_ID:
    value: "1707f60c-e080-4213-9fa2-d11c19bd3b01"
    description: "Postman workspace whose collections are run."
  POSTMAN_COLLECTION_IDS:
    value: ""
    description: "Optional comma-separated collection UIDs to run, e.g. 58347765-2ecd07bb-...,58347765-6081c4dd-... Every id must be in the workspace. Empty = run every collection."
  POSTMAN_ENVIRONMENT_ID:
    value: ""
    description: "Optional environment UID. Empty = the workspace environment whose baseUrl is a Postman mock URL."
  POSTMAN_RESPONSE_TIME_THRESHOLD:
    value: "5000"
    description: "Max response time (ms) the collections accept (passed as RESPONSE_TIME_THRESHOLD)."

stages:
  - prepare
  - test

postman:resolve:
  stage: prepare
  extends: .postman-resolve-workspace

# Child pipeline generated by postman:resolve: one job per collection.
# strategy: depend makes this job (and the pipeline) fail if any of them fails.
postman:collections:
  stage: test
  needs: [postman:resolve]
  trigger:
    include:
      - artifact: collection-runs.gitlab-ci.yml
        job: postman:resolve
    strategy: depend
