name: One or more supplied route or query parameters are invalid.
request:
  url: "{{baseUrl}}/apod-basic?page=1&per_page=25&date_from=141001&date_to=141002&_fields=date,title,url"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: page
      value: "1"
      description: One-based result page number.
    - key: per_page
      value: "25"
      description: Maximum entries returned per page.
    - key: date_from
      value: "141001"
      description: Inclusive lower APOD date bound in YYMMDD format.
    - key: date_to
      value: "141002"
      description: Inclusive upper APOD date bound in YYMMDD format.
    - key: _fields
      value: date,title,url
      description: Comma-separated response fields to return.
  body:
    type: text
    content: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
    Link: https://a.co
  body:
    type: json
    content: |-
      {
        "code": "rest_invalid_param",
        "message": "Invalid parameter(s): date_from",
        "data": {
          "status": 400,
          "params": {
            "date_from": "Invalid parameter."
          },
          "details": []
        }
      }
