$kind: http-example
id: 0639a29e-8e8e-461c-ba43-4c8c053c7eab
name: Plain HTML source for the requested APOD entry.
request:
  url: "{{baseUrl}}/apod-basic/:date/html"
  method: GET
  headers:
    Accept: text/plain
  pathVariables:
    - key: date
      value: "141001"
      description: APOD date in YYMMDD format, for example 141001.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
    Link: https://a.co
  body:
    type: text
    content: string
order: 1000
