$kind: collection
id: 6081c4dd-220f-55be-a03c-bb01e251a186
description: |-
  Public API for NASA Science Astronomy Picture of the Day (APOD) records.
  This describes the non-legacy NASA Science endpoint, not the transitional
  api.nasa.gov passthrough. NASA does not publish an OpenAPI document for
  this service; this contract is derived from its live route index, OPTIONS
  declarations, and APOD service documentation as observed on 2026-09-24.


  Contact Support:
   Name: NASA Science
  x-pm-onboarding-content-receipt: {"schemaVersion":1,"algorithm":"sha256","digest":"22ed73f78740f6ec546aedb4ca94d7d9c2c2fcaaa36a549d67e193cbad04cef5"}
variables:
  baseUrl: https://science.nasa.gov/wp-json/wp/v2
scripts:
  - type: http:beforeRequest
    code: |-
      // postman-enterprise-automation: private-mock-auth-root
      var privateMockApiKey = pm.variables.get('postmanPrivateMockApiKey');
      var privateMockHost = '';
      try {
        var privateMockUrl = pm.variables.replaceIn(pm.request.url.toString());
        privateMockHost = new URL(privateMockUrl).hostname;
      } catch (error) {
        console.warn('Could not resolve the request URL for private mock authentication; x-api-key was not added.');
      }
      var isPrivateMockHost = /(^|\.)mock\.pstmn\.io$/i.test(privateMockHost);
      if (isPrivateMockHost && privateMockApiKey) {
        pm.request.headers.upsert({ key: 'x-api-key', value: privateMockApiKey });
      } else if (isPrivateMockHost) {
        console.warn('This mock server is private. Set the postmanPrivateMockApiKey variable to a Postman API key with access to it, or the request returns 401.');
      }
    language: text/javascript
