$kind: http-example
id: 1dc0c16b-f825-4a3b-af7c-f0babc5ec447
name: Plain HTML source for the requested APOD entry.
request:
  url: "{{baseUrl}}/apod-basic/:date/html"
  method: GET
  headers:
    Accept: text/plain
  pathVariables:
    - key: date
      value: "141001"
      description: APOD date in YYMMDD format, for example 141001.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
    Link: https://a.co
  body:
    type: text
    content: string
order: 1000
