name: Postman mock CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: postman-mock-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate CI inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$POSTMAN_API_KEY"
          test -f services/nasa-apod/openapi.yaml
          test -f .postman/resources.yaml

      - name: Install and log in to Postman CLI
        shell: bash
        run: |
          curl -fsSL https://dl-cli.pstmn.io/install/unix.sh | sh
          postman login --with-api-key "$POSTMAN_API_KEY"

      - name: Resolve generated resource IDs
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'yaml'
          resources = YAML.load_file('.postman/resources.yaml') || {}
          cloud = resources.fetch('canonical', resources.fetch('cloudResources', {}))
          collections = cloud.fetch('collections', {})
          environments = cloud.fetch('environments', {})
          workspace_id = resources.dig('workspace', 'id')
          smoke = collections.find { |path, _| path.include?('[Smoke]') }&.last
          contract = collections.find { |path, _| path.include?('[Contract]') }&.last
          environment = environments.find { |path, _| path.end_with?('/prod.postman_environment.json') }&.last || environments.values.first
          missing = []
          missing << 'workspace ID' if workspace_id.to_s.empty?
          missing << 'smoke collection' if smoke.to_s.empty?
          missing << 'contract collection' if contract.to_s.empty?
          missing << 'environment' if environment.to_s.empty?
          abort("Missing Postman resource IDs in .postman/resources.yaml: #{missing.join(', ')}") unless missing.empty?
          File.open(ENV.fetch('GITHUB_ENV'), 'a') do |file|
            file.puts("POSTMAN_WORKSPACE_ID=#{workspace_id}")
            file.puts("POSTMAN_SMOKE_COLLECTION_UID=#{smoke}")
            file.puts("POSTMAN_CONTRACT_COLLECTION_UID=#{contract}")
            file.puts("POSTMAN_ENVIRONMENT_UID=#{environment}")
          end
          RUBY

      - name: Lint the OpenAPI specification
        shell: bash
        run: postman spec lint services/nasa-apod/openapi.yaml --workspace-id "$POSTMAN_WORKSPACE_ID"

      - name: Show selected environment base URL
        shell: bash
        run: |
          curl -fsSL \
            -H "X-Api-Key: $POSTMAN_API_KEY" \
            "https://api.postman.com/environments/$POSTMAN_ENVIRONMENT_UID" |
            jq -r '.environment.values[] | select(.key == "baseUrl") | .value'

      - name: Run generated Smoke collection against the mock
        shell: bash
        run: |
          postman collection run "$POSTMAN_SMOKE_COLLECTION_UID" \
            --environment "$POSTMAN_ENVIRONMENT_UID" \
            --env-var "postmanPrivateMockApiKey=$POSTMAN_API_KEY" \
            --report-events

      - name: Run generated Contract collection against the mock
        shell: bash
        run: |
          postman collection run "$POSTMAN_CONTRACT_COLLECTION_UID" \
            --environment "$POSTMAN_ENVIRONMENT_UID" \
            --env-var "postmanPrivateMockApiKey=$POSTMAN_API_KEY" \
            --report-events
