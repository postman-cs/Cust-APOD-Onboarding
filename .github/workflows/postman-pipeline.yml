name: Postman APOD onboarding

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: postman-apod-onboarding
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: resolve_token
        name: Resolve Postman service token
        uses: postman-cs/postman-resolve-service-token-action@v2.2.6
        with:
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}

      - id: bootstrap
        name: Bootstrap Postman assets
        uses: postman-cs/postman-bootstrap-action@v2.22.0
        with:
          project-name: NASA Science APOD
          domain: NASA Science
          domain-code: NASA
          spec-path: services/nasa-apod/openapi.yaml
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-access-token: ${{ steps.resolve_token.outputs.token }}
          credential-preflight: enforce
          branch-strategy: publish-gate
          canonical-branch: main

      - id: smoke_flow
        name: Apply derived smoke flow
        uses: postman-cs/postman-smoke-flow-action@v3.7.5
        with:
          project-name: NASA Science APOD
          workspace-id: ${{ steps.bootstrap.outputs.workspace-id }}
          spec-id: ${{ steps.bootstrap.outputs.spec-id }}
          smoke-collection-id: ${{ steps.bootstrap.outputs.smoke-collection-id }}
          spec-path: services/nasa-apod/openapi.yaml
          flow-mode: auto
          persist-derived-flow: true
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-access-token: ${{ steps.resolve_token.outputs.token }}
          team-id: ${{ steps.resolve_token.outputs.team-id }}
          branch-strategy: publish-gate
          canonical-branch: main

      - id: repo_sync
        name: Sync generated Postman assets
        uses: postman-cs/postman-repo-sync-action@v2.11.1
        with:
          project-name: NASA Science APOD
          repo-url: https://github.com/${{ github.repository }}
          workspace-id: ${{ steps.bootstrap.outputs.workspace-id }}
          baseline-collection-id: ${{ steps.bootstrap.outputs.baseline-collection-id }}
          smoke-collection-id: ${{ steps.smoke_flow.outputs.smoke-collection-id }}
          contract-collection-id: ${{ steps.bootstrap.outputs.contract-collection-id }}
          spec-id: ${{ steps.bootstrap.outputs.spec-id }}
          spec-content-changed: ${{ steps.bootstrap.outputs.spec-content-changed }}
          spec-path: services/nasa-apod/openapi.yaml
          collection-sync-mode: refresh
          spec-sync-mode: update
          monitor-type: cli
          generate-ci-workflow: 'true'
          repo-write-mode: commit-only
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-access-token: ${{ steps.resolve_token.outputs.token }}
          team-id: ${{ steps.resolve_token.outputs.team-id }}
          credential-preflight: enforce
          branch-strategy: publish-gate
          canonical-branch: main
          github-token: ${{ github.token }}

      - name: Publish generated assets pull request
        if: steps.repo_sync.outputs.commit-sha != ''
        env:
          GH_TOKEN: ${{ secrets.POSTMAN_REPO_PUBLISH_TOKEN }}
          GENERATED_BRANCH: postman/generated-main
          GENERATED_COMMIT: ${{ steps.repo_sync.outputs.commit-sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?POSTMAN_REPO_PUBLISH_TOKEN is required}"
          ORIGINAL_ORIGIN="$(git remote get-url origin)"
          trap 'git remote set-url origin "$ORIGINAL_ORIGIN"' EXIT
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git switch --detach "$GENERATED_COMMIT"

          if git ls-remote --exit-code --heads origin "refs/heads/${GENERATED_BRANCH}" >/dev/null; then
            git fetch origin "refs/heads/${GENERATED_BRANCH}:refs/remotes/origin/${GENERATED_BRANCH}"
            git push --force-with-lease="refs/heads/${GENERATED_BRANCH}:$(git rev-parse "refs/remotes/origin/${GENERATED_BRANCH}")" origin "HEAD:refs/heads/${GENERATED_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${GENERATED_BRANCH}"
          fi

          if ! gh pr list --repo "$REPOSITORY" --head "$GENERATED_BRANCH" --base main --state open --json url --jq '.[0].url' | grep -q .; then
            gh pr create --repo "$REPOSITORY" --base main --head "$GENERATED_BRANCH" --title "chore: sync Postman artifacts and metadata" --body "Generated by Postman onboarding run ${{ github.run_id }}."
          fi
